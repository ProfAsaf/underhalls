<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>UNDERHALLS: The Vein Below</title>
<style>
:root{
  --bg:#0b0c10; --panel:#14161d; --panel2:#1a1d26; --line:#262a35;
  --ink:#e8e2d0; --dim:#8b8fa0; --faint:#565b66;
  --acc:#e0a34a; --blood:#c04a3e; --arcane:#7ea8d8; --moss:#6f9e64; --gold:#d8b25a;
  --shard:#c88ae0; --watch:#9ab8c8; --up:#93e07c; --dn:#ff8f78;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);
  font-family:ui-monospace,Menlo,Consolas,"Cascadia Mono","SF Mono",monospace;
  font-size:14px;line-height:1.45;user-select:none;-webkit-user-select:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{position:fixed;inset:0;display:none;flex-direction:column;overflow:hidden;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.screen.on{display:flex}
h1{font-size:24px;letter-spacing:.32em;font-weight:700;color:var(--acc);text-align:center}
.sub{color:var(--dim);text-align:center;font-size:12px;letter-spacing:.1em}
.eyebrow{font-size:10px;letter-spacing:.25em;color:var(--faint);text-transform:uppercase;margin-bottom:6px}
button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);
  border-radius:6px;padding:10px 14px;cursor:pointer}
button:active{background:var(--line)}
button.primary{background:var(--acc);color:#1a1206;border-color:var(--acc);font-weight:700}
button.ghost{background:transparent}
#title{align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px}
#title .rune{color:var(--blood);font-size:12px;letter-spacing:.5em}
#title .tag{max-width:320px;color:var(--dim);font-size:12px}
#toneRow{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--faint)}
#toneRow .dot{width:16px;height:16px;border-radius:50%;border:1px solid var(--line);background:var(--panel2)}
#toneRow .dot.on{background:var(--watch);border-color:var(--watch)}
#create{padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
#create .head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
#create .head h2{font-size:13px;letter-spacing:.3em;color:var(--acc)}
#create .head .step{font-size:11px;color:var(--faint)}
.pickerwrap{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:8px;min-height:0}
.cardlist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:0;
  -webkit-overflow-scrolling:touch;padding-bottom:4px}
.card{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel);position:relative;transition:border-color .12s,box-shadow .12s}
.card.sel{border-color:var(--acc);background:var(--panel2);box-shadow:0 0 0 1px var(--acc),0 0 16px rgba(216,178,90,.25)}
.card.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc);border-radius:8px 0 0 8px}
.card .rsp{float:left;margin-right:8px}
.bigspr{image-rendering:pixelated;background-repeat:no-repeat;margin:0 auto}
.pcSpr{filter:drop-shadow(0 4px 8px rgba(0,0,0,.55))}
.eqchips{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.eqchips .bigspr{margin:0;border:1px solid var(--line);border-radius:6px;background-color:rgba(255,255,255,.04);padding:2px}
.seclab{font-size:10px;letter-spacing:.2em;color:var(--faint);margin:10px 2px 2px;border-bottom:1px solid var(--line);padding-bottom:3px}
.stg{display:flex;align-items:center;gap:8px;margin:5px 0}
.stg .sn{width:34px;font-size:12px;letter-spacing:.1em;color:var(--dim)}
.stg .sbar{flex:1;height:10px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.stg .sfill{height:100%;background:linear-gradient(90deg,var(--acc),#e8cf8a)}
.stg .sv{width:30px;text-align:right;font-size:16px;font-weight:700}
.stg .sm{width:92px;font-size:11px;color:var(--dim);text-align:right;line-height:1.5}
.stg .sm .up{color:var(--up);font-weight:700} .stg .sm .dn{color:var(--dn);font-weight:700}
@keyframes rollflash{0%{background:rgba(216,178,90,.22)}100%{background:transparent}}
.flash{animation:rollflash .5s ease-out;border-radius:8px}
.card .nm{display:flex;justify-content:space-between;align-items:baseline}
.card .nm b{font-size:14px;letter-spacing:.05em}
.card .xr{font-size:11px;color:var(--gold)}
.card .xr.cheap{color:var(--moss)} .card .xr.dear{color:var(--blood)}
.statline{display:flex;gap:8px;font-size:11px;color:var(--dim);margin-top:3px;flex-wrap:wrap}
.statline .up{color:var(--up);font-weight:700} .statline .dn{color:var(--dn);font-weight:700}
.abil{font-size:11px;color:var(--arcane);margin-top:3px}
.blurb{font-size:11px;color:var(--faint);margin-top:3px;font-style:italic}
.navrow{display:flex;gap:8px}
.navrow button{flex:1}
#sheet{padding:12px;overflow-y:auto}
#sheet table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}
#sheet td,#sheet th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
#sheet th{color:var(--faint);font-weight:400;font-size:10px;letter-spacing:.15em;text-transform:uppercase}
#sheet td.num{text-align:right}
.pricebox{border:1px dashed var(--gold);border-radius:8px;padding:8px 10px;margin:10px 0;font-size:12px}
.pricebox b{color:var(--gold)}
#game{background:#000}
#hud{padding:5px 10px 4px;background:var(--panel);border-bottom:1px solid var(--line);font-size:11px}
#hudTop{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#hud .bar{display:flex;align-items:center;gap:5px}
#hud .bar .track{width:64px;height:8px;background:#000;border:1px solid var(--line);border-radius:3px;overflow:hidden}
#hud .bar .fill{height:100%;background:var(--blood)}
#hud .bar.sp .fill{background:var(--arcane)}
#hud .dep{color:var(--acc);margin-left:auto}
#hudPools{display:flex;gap:8px;margin-top:3px;font-size:10px;color:var(--dim);flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);border-radius:4px;padding:3px 7px}
.chip.orig{border-color:var(--acc)}
#unb{color:var(--gold)}
#shardChip{color:var(--shard)}
#stage{flex:1;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.55) 100%)}
#log{position:absolute;left:8px;right:8px;bottom:6px;pointer-events:none;font-size:12px;line-height:1.4;
  text-shadow:0 1px 3px #000}
#log .m{opacity:.95}#log .m.old{opacity:.55}#log .m.older{opacity:.3}
.mg-hit{color:var(--ink)} .mg-dmg{color:var(--blood)} .mg-good{color:var(--moss)}
.mg-mag{color:var(--arcane)} .mg-gold{color:var(--gold)} .mg-sys{color:var(--dim)}
.mg-watch{color:var(--watch)} .mg-shard{color:var(--shard)}
#toasts{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;
  gap:5px;align-items:center;pointer-events:none;max-width:92%}
.toast{background:rgba(10,12,18,.92);border:1px solid var(--watch);color:var(--watch);border-radius:6px;
  padding:6px 12px;font-size:12px;text-align:center;animation:tfade 3.2s forwards}
.toast.shard{border-color:var(--shard);color:var(--shard)}
.toast.ach{border-color:var(--gold);color:var(--gold)}
@keyframes tfade{0%{opacity:0;transform:translateY(-6px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.dmgf{position:absolute;pointer-events:none;font-weight:700;font-size:14px;text-shadow:0 1px 3px #000;animation:dfl .7s forwards}
@keyframes dfl{0%{opacity:0;transform:translate(-50%,-40%)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-170%)}}
.df-hit{color:var(--ink)} .df-dmg{color:var(--blood)} .df-crit{color:var(--gold);font-size:17px}
#controls{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
#verbs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;flex:1;max-width:210px}
#verbs button{padding:11px 4px;font-size:11px;letter-spacing:.03em}
#verbs button.ctx{grid-column:1 / -1;border-color:var(--acc);color:var(--acc)}
#verbs button:disabled{opacity:.35}
#vPower{border-color:var(--shard);color:var(--shard)}
#dpad{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px);gap:4px}
#dpad button{padding:0;font-size:16px;color:var(--dim);border-radius:8px}
#dpad button.mid{color:var(--faint);font-size:11px}
.modal{position:fixed;inset:0;background:rgba(5,6,9,.88);display:none;flex-direction:column;
  padding:calc(14px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom));z-index:50}
#mClose{min-height:44px;min-width:88px;padding:10px 18px;font-size:14px}
#mClose2{margin-top:8px;width:100%;min-height:48px;font-size:14px;letter-spacing:.15em;
  border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--ink)}
#hud{padding-top:calc(4px + env(safe-area-inset-top))}
.modal.on{display:flex}
.modal .mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.modal .mhead h3{font-size:13px;letter-spacing:.25em;color:var(--acc)}
.mlist{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:6px}
.mlist .row{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--panel);font-size:13px}
.mlist .row .d{font-size:11px;color:var(--dim);margin-top:2px}
.mlist .row.eq{border-color:var(--moss)}
.mlist .row.dis{opacity:.4}
.mlist .row.pickable{border-color:var(--watch)}
.mlist .row.shardrow{border-color:var(--shard)}
.dollbox{border:1px solid var(--line);border-radius:8px;padding:8px 6px 6px;background:var(--panel);text-align:center}
.mlist textarea{width:100%;min-height:140px;background:#000;color:var(--ink);border:1px solid var(--line);border-radius:6px;font:inherit;font-size:10px;padding:6px}
.actrow{display:flex;gap:6px;margin-top:8px}
.actrow button{flex:1;font-size:12px;padding:9px 4px}
#end{align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px;background:var(--bg);z-index:40}
#end h2{font-size:20px;letter-spacing:.3em}
#end.dead h2{color:var(--blood)} #end.won h2{color:var(--gold)}
#end .stats{font-size:12px;color:var(--dim);line-height:1.9}
#end .stats b{color:var(--ink)}
</style>
</head>
<body>

<div id="title" class="screen on">
  <div class="rune" id="rune">* * *</div>
  <h1>UNDERHALLS</h1>
  <div class="sub">THE VEIN BELOW</div>
  <div class="tag">A mining colony broke into something at 1000 feet. It is still down there. It pays attention, and attention is a currency.</div>
  <button class="primary" id="btnCont" style="min-width:210px;display:none">Continue the descent</button>
  <button class="primary" id="btnNew" style="min-width:210px">Roll a character</button>
  <button class="ghost" id="btnHelp" style="min-width:210px;color:var(--dim)">How to play</button>
  <button class="ghost" id="btnSlots" style="min-width:210px;color:var(--faint);font-size:12px">Save slots</button>
  <button class="ghost" id="btnBoard" style="min-width:210px;color:var(--faint);font-size:12px">The Record</button>
  <button class="ghost" id="btnSaveCode" style="min-width:210px;color:var(--faint);font-size:12px">Save code</button>
  <div id="toneRow"><span>Watcher</span><span id="toneDots"></span><span id="toneLbl"></span></div>
  <div id="metaLine" style="font-size:10px;color:var(--faint)"></div>
  <div id="buildLine" style="font-size:10px;color:var(--faint);opacity:.7;margin-top:4px"></div>
</div>

<div id="create" class="screen">
  <div class="head"><h2 id="crTitle">CHOOSE A RACE</h2><div class="step" id="crStep">1 / 3</div></div>
  <div class="pickerwrap">
    <div class="cardlist" id="crList"></div>
    <div class="navrow">
      <button id="crBack" class="ghost">Back</button>
      <button id="crRand" class="ghost">Random</button>
      <button id="crNext" class="primary">Next</button>
    </div>
  </div>
</div>

<div id="sheet" class="screen"></div>

<div id="game" class="screen">
  <div id="hud"><div id="hudTop"></div><div id="hudPools"></div></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="vignette"></div>
    <div id="toasts"></div>
    <div id="log"></div>
  </div>
  <div id="controls">
    <div id="verbs">
      <button class="ctx" id="vCtx">Wait</button>
      <button id="vInv">Pack</button>
      <button id="vCast">Cast</button>
      <button id="vFire">Fire</button>
      <button id="vCamp">Camp</button>
      <button id="vPower">Power</button>
      <button id="vLog">Log</button>
    </div>
    <div id="dpad"></div>
  </div>
</div>

<div id="end" class="screen"></div>

<div class="modal" id="modal">
  <div class="mhead"><h3 id="mTitle">PACK</h3><button class="ghost" id="mClose">Close</button></div>
  <div class="mlist" id="mList"></div>
  <button id="mClose2">CLOSE</button>
  
</div>

<script>
"use strict";
/* ============ helpers ============ */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const dice=(n,d,p=0)=>{let t=p;for(let i=0;i<n;i++)t+=ri(1,d);return t};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const smod=s=>Math.floor((s-10)/2);
const pick=a=>a[ri(0,a.length-1)];
const dist=(a,b,c,d)=>Math.max(Math.abs(a-c),Math.abs(b-d));
const el=id=>document.getElementById(id);
const capz=s=>s.charAt(0).toUpperCase()+s.slice(1);
const STATN=["STR","INT","WIS","DEX","CON"];

/* ============ strata ============ */
const STRATA=[
{n:"The Workings",lo:1,hi:4,wall:"#4a4436",floor:"#3d4048",acc:"#e0a34a",reg:"foreman",
 amb:["Shift change was four years ago. Nobody clocked out.",
 "The support beams are load-bearing. So is the silence.",
 "It notes your lamp. Fuel is a promise you make to the dark."]},
{n:"The Bloom",lo:5,hi:8,wall:"#3f4a3a",floor:"#334039",acc:"#b08ad8",reg:"chorus",
 amb:["We grew where the miners stopped. We are very grateful.",
 "The spores remember every breath taken here. Yours are being filed.",
 "Everything below this line is technically alive."]},
{n:"The Drowned Archive",lo:9,hi:12,wall:"#2f4a52",floor:"#2b3a42",acc:"#58c8b8",reg:"librarian",
 amb:["Quiet, please. The water has excellent hearing.",
 "Most of these records concern you. Filed under: pending.",
 "Late returns are handled by the things in the stacks."]},
{n:"The Armory",lo:13,hi:16,wall:"#4a4030",floor:"#38342c",acc:"#d8c05a",reg:"quartermaster",
 amb:["Sign for your losses at the cage. Ammunition is not a right.",
 "Somebody manufactured all of this down here. Ask yourself for whom.",
 "Powder is dry. Morale is not your department."]},
{n:"The Vein",lo:17,hi:20,wall:"#5a3040",floor:"#3e2a36",acc:"#ff7a8a",reg:"vein",
 amb:["You came all this way. I felt every step.",
 "The others stopped at the door of me. You did not. Good.",
 "Closer. I want to see what you paid for."]}];
function stratum(d){return STRATA[clamp(Math.floor((d-1)/4),0,4)]}
function stratumIdx(d){return clamp(Math.floor((d-1)/4),0,4)}
function stratumMult(d){return 1+0.15*stratumIdx(d)}

/* ============ the Watcher ============ */
let TONE=3;
const QUIPS={
 lvl:["It updates a ledger you will never see.","Somewhere below, something underlines your name.",
  "It approves, in the way an auditor approves.","Filed. Stamped. Watched."],
 kill:["It liked that.","Noted with interest.","The dark applauds without hands."],
 death:["It files you under: promising.","Attention withdrawn."]};
function announce(text,kind,toastToo){
  msg("["+text+"]",kind==="shard"?"mg-shard":kind==="ach"?"mg-gold":"mg-watch");
  if(toastToo)toast(text,kind);
}
function quip(pool){
  if(TONE<=0)return;
  if(Math.random()<TONE*0.05){const q=QUIPS[pool]||QUIPS.lvl;msg(pick(q),"mg-watch")}
}
function toast(text,kind){
  const t=document.createElement("div");
  t.className="toast"+(kind==="shard"?" shard":kind==="ach"?" ach":"");
  t.textContent="["+text+"]";
  el("toasts").appendChild(t);
  setTimeout(()=>t.remove(),3300);
}

/* ============ achievements ============ */
const ACH={
 taste:{n:"Taste Tester",d:"Three unknown potions in a row.",q:"Medically, the dark is rooting for you."},
 rentfree:{n:"Rent Free",d:"Your Threshold turned away 12 callers.",q:"Hospitality with a door policy."},
 economist:{n:"Economist",d:"Banked 1,000+ XP in one rest.",q:"Delayed gratification. It approves."},
 overkill:{n:"Crowd Work",d:"Three kills in one turn.",q:"Efficient. It counted twice to be sure."},
 closecall:{n:"Margin Call",d:"Survived a hit below 5% HP.",q:"That was almost interesting."},
 untouched:{n:"No Contact",d:"Cleared a floor without taking damage.",q:"It finds your caution adorable."},
 spelunk:{n:"Speleologist",d:"Dug through 25 walls.",q:"The mountain files a complaint."},
 gourmand:{n:"Gourmand",d:"Cooked 8 meals from the local fauna.",q:"The fauna objects, quietly."},
 host:{n:"Maitre D'Hotel",d:"Hosted 5 rituals.",q:"Guests: zero. Standards: high."},
 fork:{n:"Fork in the Dark",d:"Took your first class fork."},
 merge:{n:"Consolidation",d:"Merged two classes. There is no undo."},
 deviant:{n:"Deviation",d:"Drank a vial you should not have."},
 second:{n:"Second Wind",d:"Second trigger. It leaned closer."},
 pockets:{n:"Deep Pockets",d:"Carried 2,000 gold."},
 tourist:{n:"Full Descent",d:"Set foot in all five strata."},
 armed:{n:"Provenance",d:"Recovered a named artifact."},
 librarian:{n:"Special Collections",d:"Read 4 kinds of scroll."},
 vialed:{n:"Informed Consent",d:"Chose a power from a vial."},
 triggered:{n:"Trigger Event",d:"The worst moment of your life, witnessed."},
 slayer:{n:"Landmark",d:"Killed a named unique."},
 robbery:{n:"Outstanding Balance",d:"You robbed the Company Store."},
 paper:{n:"Complete Records",d:"Collected every fragment of the paper trail."},
 witness:{n:"Witnessed",d:"Won on the hardest shift."},
 strike:{n:"The Argument",d:"You struck the thing at the bottom."},
 bargain:{n:"The Transaction",d:"You paid the thing at the bottom."},
 listen:{n:"The Audience",d:"You heard the thing at the bottom out."},
 patience:{n:"Patience",d:"You out-waited the dark itself."},
 seam:{n:"Clean Seam",d:"Left nothing in the walls."},
 evolved:{n:"Unfolded",d:"Became what was waiting inside."},
 stained:{n:"In the File",d:"Five marks. It stopped pretending not to notice."},
 roster:{n:"Repossessor",d:"Paid a debt with other names."}
};
function award(id){
  if(!G||G.ach[id])return;
  G.ach[id]=true;
  const a=ACH[id];
  announce("Achievement: "+a.n+". "+a.d,"ach",true);
  if(a.q&&TONE>=2)msg(a.q,"mg-watch");
  if(["overkill","closecall","slayer","untouched","second"].includes(id))dropCrate(id==="untouched"?3:id==="second"?4:2);
}
/* ============ evolutions ============ */
const EVOS={
 drakeling:{key:"WYRM",lvl:18,dep:12,
  line:"The folded thing inside you finishes unfolding. Wings the color of your patience.",
  b:{mhp:10,dmg:2,ac:2,infra:2,spd:2},spell:"breath"},
 halftroll:{key:"TRUE TROLL",lvl:16,dep:10,
  line:"The half stops mattering. The mountain recognizes kin.",
  b:{mhp:12,regen:1,dmg:1},spell:null},
 revenant:{key:"HOLLOW CROWN",lvl:16,dep:10,undead:20,
  line:"The dead take a knee, one by one. You do not remember asking.",
  b:{mhp:6,save:2,spd:2},spell:null}};
/* ============ difficulty & meta ============ */
const DIFFS=[
{n:"Tourist",xr:0.9,pmhp:1.25,mdm:0.85,mhpm:0.9,loot:1.2,price:0.8,trig:0.25,up:0,
 blurb:"The dark pulls its punches. The Watcher will absolutely mention this.",d:"For seeing the sights."},
{n:"Miner",xr:1,pmhp:1,mdm:1,mhpm:1,loot:1,price:1,trig:0.20,up:0,
 blurb:"The shift as posted.",d:"The intended game."},
{n:"Delver",xr:1.15,pmhp:1,mdm:1.2,mhpm:1.25,loot:0.85,price:1.3,trig:0.18,up:0,
 blurb:"Purses close. Fauna hits harder. Advancement costs more.",d:"Hard."},
{n:"The Witness",xr:1.3,pmhp:1,mdm:1.35,mhpm:1.5,loot:0.7,price:1.6,trig:0.15,up:2,
 blurb:"Deeper things wander up to meet you. It watches you specifically. The deepest door opens only here.",d:"Very hard. Expect to be filed many times."}];
function loadMeta(){try{const m=JSON.parse(localStorage.getItem("uh2meta"));if(m)return m}catch(e){}
  return{tries:0,deep:0,wins:[0,0,0,0],rev:0,pat:0}}
let META=loadMeta();

function noteFor(depth){
  const si=stratumIdx(depth);

  return un.length?un[0]:null;
}
function readNote(it){
  const p=G.p,N=it.tx||NOTES[it.id];
  removeInv(it);
  if(it.id!==undefined)p.found[it.id]=1;
  tag("scribe",Math.floor(6*stratumMult(G.depth)));
  openModal("THE PAPER TRAIL");
  const L=el("mList");
  mrow(L,'"'+N.t+'"','<i>'+N.b+"</i>","");
  const c=Object.keys(p.found).length;
  mrow(L,c+" of "+NOTES.length+" collected","The rest are down there somewhere, filed under later.");
  if(c===NOTES.length)award("paper");
}
function openTrail(){

  const c=Object.keys(p.found).length;
  mrow(L,c+" of "+NOTES.length+" collected","Fragments of what happened here, in roughly the order it happened.");

  });
}

function genPower(rating,forceCls){
  const cls=forceCls||pick(Object.keys(CLASSIF));
  const ks=KEYSTONES.filter(k=>k.c===cls&&Math.random()<.6)[0];
  const med=ks?ks.m:pick(MEDIA)[0];
  const built=CLASSIF[cls].mk(rating);
  const nm=ks?ks.n:(capz(med)+" "+pick(["Writ","Debt","Hymn","Verdict","Toll","Lease","Clause","Echo"])).toUpperCase();
  const dbn=rating>=7?2:rating>=4?1:Math.random()<.4?1:0;
  const dks=Object.keys(DRAWS).sort(()=>Math.random()-.5).slice(0,dbn);
  return{name:nm,cls,rating,lvl:1,xp:0,med,eff:built.key,mag:built.mag,cdMax:built.cd,cd:0,
    pb:built.pb||{},db:dks,desc:built.d};
}

function shardBonus(key){

function checkTrigger(){
  const p=G.p;
  if(p.shard||p.triggered||p.hp<=0)return;
  if(p.hp>=G.diff.trig*p.mhp)return;
  const hostiles=G.mons.filter(m=>!m.ally&&m.aware&&losClear(m.x,m.y,p.x,p.y)&&dist(m.x,m.y,p.x,p.y)<=8).length;
  if(hostiles<2)return;
  p.triggered=true;
  const statuses=["pois","blind"].filter(k=>p.status[k]>0).length;
  let D=2*(1-p.hp/p.mhp)+0.5*hostiles+0.15*G.depth+0.3*statuses+0.05*(totalUnbanked()/100);
  const rating=clamp(Math.round(D),2,9);
  p.shard=genPower(rating);
  announce("Trigger event.","shard",true);
  announce(p.shard.name+". "+p.shard.cls+" "+rating+".","shard",true);
  msg(capz(p.shard.desc)+".","mg-shard");
  for(const d of p.shard.db)msg("Cost: "+DRAWS[d].tx+".","mg-shard");
  if(TONE>=2)msg("The worst moment of your life, and something down there took notes.","mg-watch");
  award("triggered");
  renderHud();
}
function checkSecondTrigger(){
  const p=G.p,s=p.shard;
  if(!s||s.second||G.depth<16||p.hp<=0)return;
  if(p.hp>=0.1*p.mhp||s.lvl<5)return;
  s.second=true;
  const oldBase=CLASSIF[s.cls].mk(s.rating);
  const earnedMag=Math.max(0,s.mag-oldBase.mag);
  const earnedCd=Math.max(0,oldBase.cd-s.cdMax);
  s.rating=clamp(s.rating+2,2,9);
  const re=CLASSIF[s.cls].mk(s.rating);
  s.mag=re.mag+earnedMag;
  s.cdMax=Math.max(3,re.cd-4-earnedCd);
  s.desc=re.d;
  const newDb=Object.keys(DRAWS).filter(k=>!s.db.includes(k));
  if(newDb.length)s.db.push(pick(newDb));
  announce("Second trigger. "+s.name+" is "+s.cls+" "+s.rating+" now.","shard",true);
  msg("It leaned closer.","mg-watch");
  award("second");
  renderHud();
}
function shardFeed(monDef){
  const s=G.p.shard;if(!s||s.lvl>=9)return;
  const band=Math.ceil(s.rating*2);
  const md=(monDef.d[0]+monDef.d[1])/2;
  if(md<band-4)return;
  s.xp+=Math.max(1,Math.floor(monDef.xp/8));
  const need=s.lvl*12;
  if(s.xp>=need){s.xp-=need;s.lvl++;s.mag++;s.cdMax=Math.max(3,s.cdMax-1);
    announce(s.name+" deepens. Shard level "+s.lvl+".","shard",true)}
}

function openCrate(it){

  else if(tier===2){if(Math.random()<.3)push({t:"vial",r:clamp(stratumIdx(G.depth)+3,2,9)});

  else{const a=tryArtifact(20);push(a||genRelic(20));push({t:"vial",r:9});push({t:"pot",k:"heal"});push({t:"pot",k:"str"})}
  if(poolHasSkill("gambler","JACKPOT"))push(randItem(G.depth+2));
  for(let i=0;i<behv("crateb");i++)push(randItem(G.depth+1));
  if(tier>=3&&Math.random()<.35)push(genRelic(G.depth+3));
  tag("gambler",Math.floor(10*stratumMult(G.depth)));

const SHOPK=[
{n:"CLERK VENN",bark:["Store credit died with payroll. Coin only.","Sign here. And here. And here.","No refunds below the waterline."]},
{n:"THE POLITE FUNGUS",bark:["Everything is locally grown.","Please do not eat the shelving.","We accept coin, spores, and compliments."]},

function priceOf(it){
  let v=30;
  const scrip=G&&G.p&&G.p.race.ab.scrip;
  const markup=(behv("marked")?1.25:1)*(1-behv("discount")/100)*(scrip?0.8:1)*(1+(scrip?0:Math.min(4,(G&&G.stain)||0)*0.10));
  if(it.t==="pot")v={clw:15,csw:45,heal:130,str:220,speed:95,wit:60,pois:6}[it.k]||30;
  else if(it.t==="scr")v={map:55,tele:85,enh:240,aggr:6,brand:180,ward:120,recall:160}[it.k]||30;
  else if(it.t==="vial")v=280+it.r*90;
  else if(it.t==="dev")v=110+(it.ch||0)*30;
  else if(it.t==="ammo")v=(it.v||8)*4;
  else if(it.t==="gren")v=75;
  else if(it.t==="meal")v=40;
  else if(it.t==="note")v=1;
  else if(it.t==="wep"||it.t==="bow"||it.t==="arm"||it.t==="shl"||it.t==="ring"||it.t==="crown"){
    if(it.t==="ring"||it.t==="crown")v=120;
    else{const tbl=it.t==="wep"?WEAPONS:it.t==="bow"?BOWS:it.t==="arm"?ARMORS:SHIELDS;
      v=25+(tbl[it.k].minD||0)*9+(it.b||0)*70+(it.pre!==undefined?45:0)+(it.suf!==undefined?100:0);}
    if(it.relic)v=380+(it.beh?it.beh.length:0)*160+Object.keys(it.x||{}).length*90;
    else if(it.art)v=900;
  }
  return Math.max(1,Math.round(v*(1+stratumIdx(G.depth)*0.3)*G.diff.price*markup));
}
function sellPrice(it){return Math.max(1,Math.floor(priceOf(it)*(mergeActive("Pit Boss")?0.55:0.4)))}
function makeKeeper(depth){
  const si=stratumIdx(depth),K=SHOPK[si];
  return{g:"M",c:"#ffd98a",n:K.n,hp:[10+si*4,8],ac:10+si*2,sk:8+si*3,dmg:[2,5+si],sp:1,
    xp:200+si*120,d:[depth,depth],fl:{shop:1,noSleep:1}};
}
function genStock(depth){
  const si=stratumIdx(depth),s=[];
  s.push({t:"pot",k:"csw"});s.push({t:"pot",k:pick(["heal","clw","str","speed","wit"])});
  s.push({t:"scr",k:pick(Object.keys(SCROLLS))});
  const g1=Math.random()<.5?[WEAPONS,"wep"]:[ARMORS,"arm"];
  s.push(mkGear(g1[0],g1[1],depth+2));
  const g2=Math.random()<.5?[BOWS,"bow"]:[SHIELDS,"shl"];
  s.push(mkGear(g2[0],g2[1],depth+2));
  if(si>=3){s.push({t:"ammo",v:ri(10,20)});if(Math.random()<.5)s.push({t:"gren"})}
  s.push({t:"dev",k:pick(Object.keys(DEVICES)),ch:ri(3,6)});
  if(Math.random()<.25)s.push({t:"vial",r:clamp(si+2+ri(0,2),2,9)});
  if(Math.random()<.12)s.push(genRelic(depth+2));
  return s;
}
function openShop(m){
  const p=G.p;
  openModal(m.def.n+" · "+p.gold+"g");
  const L=el("mList");
  if(TONE>0)mrow(L,'"'+pick(SHOPK[stratumIdx(G.depth)].bark)+'"',"");
  mrow(L,"FOR SALE","Tap to buy.");
  for(const it of m.stock.slice()){
    const pr=priceOf(it);
    const r=document.createElement("div");
    r.className="row pickable"+(p.gold<pr?" dis":"");
    r.innerHTML="<b>"+itemName(it)+"</b>"+'<div class="d">'+pr+" gold</div>";
    r.onclick=()=>{
      if(p.gold<pr){msg("Your purse disagrees.","mg-sys");return}
      if(p.inv.length>=INVMAX){msg("Your pack is full.","mg-sys");return}
      p.gold-=pr;p.inv.push(it);
      m.stock.splice(m.stock.indexOf(it),1);
      tag("gambler",Math.max(2,Math.floor(pr/8)));
      msg("Bought: "+aName(it)+".","mg-gold");
      openShop(m);
    };
    L.appendChild(r);
  }
  mrow(L,"YOUR GOODS","Tap to sell.");
  for(const it of p.inv.slice()){
    if(it.t==="note")continue;
    const pr=sellPrice(it);
    const r=document.createElement("div");
    r.className="row pickable";
    r.innerHTML="<b>"+itemName(it)+"</b>"+'<div class="d">sells for '+pr+" gold</div>";
    r.onclick=()=>{
      removeInv(it);
      if(it===p.eq.w)p.eq.w=null;if(it===p.eq.b)p.eq.b=null;
      if(it===p.eq.a)p.eq.a=null;if(it===p.eq.s)p.eq.s=null;
      p.gold+=pr;if(p.gold>=2000)award("pockets");
      m.stock.push(it);
      msg("Sold: "+aName(it)+" for "+pr+"g.","mg-gold");
      openShop(m);
    };
    L.appendChild(r);
  }
  const rob=document.createElement("div");
  rob.className="row pickable";
  rob.style.borderColor="var(--blood)";
  rob.innerHTML="<b>Rob the till</b>"+'<div class="d">The Company remembers. Everywhere.</div>';
  rob.onclick=()=>{
    closeModal();
    G.robbed=true;stain(2,"The till remembers your hands.");
    for(const k of G.mons)if(k.def.fl.shop)k.hostile=true;
    award("robbery");
    announce("Every ledger in the dark turns to your page.","watch",true);
    m.aware=true;endTurn();
  };
  L.appendChild(rob);
}

function throwPotion(it){
  const p=G.p,k=it.k;
  removeInv(it);
  const wasUnknown=!G.idPot[k];G.idPot[k]=true;
  const t=nearestTarget(1,6);
  if(!t){msg("The bottle shatters on stone. It was "+POTIONS[k].n+".","mg-sys");endTurn();return}
  t.asleep=false;t.aware=true;
  if(k==="pois"){t.pois=(t.pois||0)+ri(6,10);
    msg("Glass and gas. The "+t.def.n+" starts dying politely.","mg-dmg")}
  else if(k==="clw"||k==="csw"||k==="heal"){
    t.hp=Math.min(t.mhp,t.hp+dice(k==="heal"?8:k==="csw"?4:2,8));
    msg("It splashes the "+t.def.n+", which appreciates this.","mg-sys")}
  else msg("It shatters on the "+t.def.n+". It was "+POTIONS[k].n+". Money well spent.","mg-sys");
  if(wasUnknown)msg("Noted: that was "+POTIONS[k].n+".","mg-good");
  endTurn();
}
function stain(n,line){
  G.stain=(G.stain||0)+n;
  if(line)announce(line,"watch",true);
  if(G.stain>=5)award("stained");
}
function devour(it){
  const p=G.p,si=stratumIdx(G.depth);
  removeInv(it);
  p.hp=Math.min(p.mhp,p.hp+4+2*si);
  if(it.g==="h"||it.g==="e")stain(1,"You knew them, in the general sense. It goes in the file.");
  else msg("Cold, honest calories.","mg-good");
  endTurn();
}
function tameTry(it){
  const p=G.p;
  const c=G.mons.find(m=>!m.ally&&dist(p.x,p.y,m.x,m.y)<=1&&
    !m.def.fl.uq&&!m.def.fl.named&&!m.def.fl.boss&&!m.def.fl.shop&&!m.def.fl.heart&&!m.def.fl.audit);
  if(!c){msg("Nothing beside you is interested in dinner. Yet.","mg-sys");return}
  removeInv(it);
  const cap=1+(poolHasSkill("cook","Monster Chef")?1:0);
  const pets=G.mons.filter(m=>m.ally&&m.pet).length;
  if(pets>=cap){msg("Your table is full.","mg-sys");endTurn();return}
  const ch=.35+(c.asleep?.25:0)+(c.hp<c.mhp/2?.15:0)+bonus("cookb")*.06;
  if(Math.random()<Math.min(.85,ch)){
    c.ally=true;c.pet=1;c.aware=true;c.asleep=false;
    announce("The "+c.def.n+" decides you are the good kind of trouble.","watch",true);
    tag("cook",Math.floor(6*stratumMult(G.depth)));
  }else{
    c.asleep=false;c.aware=true;
    msg("It eats the offering and takes offense.","mg-dmg");
  }
  endTurn();
}
function godGold(gv){const p=G.p;
  if(p.god===0){gv=Math.ceil(gv*1.15);p.godG=(p.godG||0)+gv;
    while(p.godG>=150){p.godG-=150;p.piety=(p.piety||0)+1}}
  return gv}
function prayAt(kind){
  const p=G.p,nm=ALTARS[kind].n,pi=p.piety||0;
  const ready1=pi>=3&&p.turn>=(p.godCd1||0),ready2=pi>=8&&p.turn>=(p.godCd2||0);
  if(ready2){p.godCd2=p.turn+300;
    if(kind===0){let hit=0;for(const m of G.mons.slice()){if(m.ally||!monSeen(m))continue;hit++;damageMon(m,dice(4,6),p.org.id)}
      announce(nm+" terminates "+hit+" contracts.","watch",true)}
    else if(kind===1){teleportPlayer(8);announce(nm+" moves you like a decimal point.","watch",true)}
    else{let br=0;for(const m of G.mons)if(!m.ally&&monSeen(m)&&!fearless(m)&&!(m.afraid>0)){m.afraid=ri(8,14);br++}
      announce("The Chorus lands. "+br+" nerves give out.","watch",true)}
    return}
  if(ready1){p.godCd1=p.turn+150;
    if(kind===0){p.status.shield=Math.max(p.status.shield||0,ri(15,25));msg("A shield of good standing.","mg-good")}
    else if(kind===1){p.hp=Math.min(p.mhp,p.hp+Math.floor(p.mhp*.35));msg("The Pulse takes your side.","mg-good")}
    else{p.status.haste=Math.max(p.status.haste||0,ri(10,15));msg("The Hymn carries you.","mg-good")}
    return}
  if(pi<3)msg("Devotion "+pi+"/3. It wants more before it gives anything.","mg-sys");
  else{const w1=Math.max(0,(p.godCd1||0)-p.turn),w2=Math.max(0,(p.godCd2||0)-p.turn);
    msg("Devotion "+pi+". Its gifts are resting: "+(w1>0?w1+" turns":"ready")+(pi>=8?", greater in "+(w2>0?w2+" turns":"ready"):", greater at devotion 8")+".","mg-sys")}
}
function openAltar(x,y){
  const p=G.p,kind=G.altars[x+","+y]===undefined?0:G.altars[x+","+y],A=ALTARS[kind];
  const done=()=>{G.map[y][x]=T_FLOOR;delete G.altars[x+","+y];closeModal();endTurn()};
  const opts=[];
  if(kind===0)opts.push({label:A.a,desc:A.r,fn:()=>{
    const cost=Math.floor(p.mhp/3);
    if(p.hp<=cost){msg("It declines to take the last of you.","mg-sys");return}
    p.hp-=cost;G.items.push({x,y,it:genRelic(G.depth+2)});
    announce("The ledger balances. Something with a name is issued.","watch",true);
    checkTrigger();checkSecondTrigger();done()}});
  if(kind===1)opts.push({label:A.a,desc:p.eq.w?A.r:"(You have no weapon readied.)",fn:()=>{
    const w=p.eq.w;
    if(!w){msg("Empty pans weigh nothing.","mg-sys");return}
    const v=Math.floor(priceOf(w)*2);
    removeInv(w);p.eq.w=null;
    p.unb[p.org.id]=(p.unb[p.org.id]||0)+v;
    announce("The scale tips. "+v+" of promise, unbanked, returned to your name.","watch",true);done()}});
  if(kind===2)opts.push({label:A.a,desc:A.r,fn:()=>{
    for(const m of G.mons)if(!m.ally&&!m.def.fl.boss&&!m.def.fl.heart&&!m.def.fl.audit){m.asleep=true;m.aware=false}
    G.bellDebt=1;stain(1,null);
    announce("Silence, wall to wall. Below you, something opens one eye.","watch",true);done()}});
  if(p.god===undefined||p.god===null){
    opts.push({label:"Pledge yourself",desc:"Take the mark. Keep it fed.",fn:()=>{
      p.god=kind;p.piety=0;
      announce("You kneel. "+A.n+" takes notice, and keeps taking.","watch",true);
      closeModal();endTurn()}});
  }else if(p.god===kind){
    opts.push({label:"Pray",desc:"Devotion "+(p.piety||0)+". Boons wake at 3 and 8.",fn:()=>{
      prayAt(kind);closeModal();endTurn()}});
  }else{
    opts.push({label:"Pray",desc:"(Not yours.)",fn:()=>{
      msg(A.n+" does not answer strangers.","mg-sys");closeModal()}});
  }
  opts.push({label:"Leave it",desc:"Some furniture is a question.",fn:()=>closeModal()});
  choiceModal(A.n+" · "+A.d,opts);
}
function spawnClone(t){
  const p=G.p,si=stratumIdx(G.depth);
  const cd={g:"@",c:"#f0ead8",n:"MIRROR-YOU",hp:[1,1],ac:playerAC(),
    sk:Math.max(6,Math.floor(meleeSkill()/2)),dmg:[2,4+si],sp:1,xp:1,
    d:[G.depth,G.depth],fl:{noSleep:1}};
  const s=[[p.x+1,p.y],[p.x-1,p.y],[p.x,p.y+1],[p.x,p.y-1]].find(s=>passableFor(null,s[0],s[1])&&!monAt(s[0],s[1]));
  if(!s){msg("No room beside you for another you.","mg-sys");return}
  const m=spawnMon(cd,s[0],s[1]);
  m.hp=m.mhp=Math.max(6,Math.floor(p.hp*0.6));
  m.ally=true;m.timer=t;m.aware=true;
  announce("There are two of you. The Watcher checks its notes.","watch",true);
}

}

    dmg:[base.dmg[0]+1,base.dmg[1]+1],sp:base.sp,xp:base.xp*3,d:base.d.slice(),fl,gm,kin:base};
}

function recordBoard(won,cause){
  try{
    const p=G.p;
    const orgs=activePools().map(id=>(p.pools[id].fork||(POOLS[id]?POOLS[id].n:id))+" "+p.pools[id].lvl).join(" \u00b7 ");
    const e={n:p.name||"UNNAMED",race:p.race.name,org:orgs,depth:p.maxDepth||G.depth,gold:p.gold,kills:p.kills,
      turns:p.turn,won:!!won,cause:cause||"",god:(p.god===undefined?null:p.god),
      arts:(G.artsOut||[]).slice(),prt:Object.keys(p.prtSeen||{}).length,when:Date.now()};
    let b=[];try{b=JSON.parse(lsGet("uh2board")||"[]")}catch(x){}
    b.push(e);
    b.sort((A,B)=>(B.won-A.won)||(B.depth-A.depth)||(B.kills-A.kills)||(B.gold-A.gold));
    b=b.slice(0,10);
    lsSet("uh2board",JSON.stringify(b));
  }catch(x){}
}

function losClear(x0,y0,x1,y1){

  }

}
function fov(){

function drTotal(){

  for(const sl of["a","s"]){const it=G.p.eq[sl];if(it&&it.x&&it.x.dr)dr+=it.x.dr}
  if(G.p.status.rage>0)dr+=1;

function playerAC(){
  const p=G.p;let ac=smod(p.st[3])+bonus("ac");
  if(p.eq.a)ac+=ARMORS[p.eq.a.k].ac+(p.eq.a.b||0);
  if(p.eq.s)ac+=SHIELDS[p.eq.s.k].ac+(p.eq.s.b||0);
  if(p.status.bless>0)ac+=3;
  if(p.status.shield>0)ac+=4;
  if(p.status.form>0)ac+=1;
  if(behv("goldAC"))ac+=Math.min(3,Math.floor(p.gold/600));
  if(behv("wallAC")){let w=0;
    for(const dd of[[1,0],[-1,0],[0,1],[0,-1]]){
      const row=G.map[p.y+dd[1]];const t2=row&&row[p.x+dd[0]];
      if(t2===T_WALL||t2===T_VEIN)w++;
    }
    ac+=Math.min(3,behv("wallAC")*w);
  }
  return ac;
}
function meleeSkill(){

  let sk=charLvl()*2+smod(p.st[0])*3+smod(p.st[3])+(p.org.hitb||0)*Math.ceil(charLvl()/2)+bonus("hit");
  if(w){sk+=(w.hit||0)+(p.eq.w.b||0);
    if(p.org.edged&&!w.blunt)sk-=3;}
  if(p.status.bless>0)sk+=3;
  if(p.status.rage>0)sk+=3;
  if(p.status.migraine>0)sk-=4;
  if(p.status.prone>0)sk-=4;
  if(p.status.wellfed>0)sk+=1;
  return sk;
}
function bowSkill(){
  const p=G.p;const b=p.eq.b?BOWS[p.eq.b.k]:null;
  let sk=charLvl()*2+smod(p.st[3])*3+(b?(b.hit||0)+(p.eq.b.b||0):0)+bonus("hit");
  if(p.org.bowb)sk+=Math.ceil(charLvl()/2);
  if(p.status.bless>0)sk+=3;
  if(p.status.migraine>0)sk-=4;
  if(p.status.prone>0)sk-=4;
  return sk;
}

    return'<div class="m '+age+' '+x.cls+'">'+x.text+'</div>';
  }).join("");
}
/* ============ player actions ============ */
function poolHasSkill(id,name){const pl=G.p.pools[id];return!!(pl&&pl.sk.some(s=>s.n===name))}
function passableFor(m,x,y){
  if(x<1||y<1||x>=MW-1||y>=MH-1)return false;
  const t=G.map[y][x];
  if(m&&m.def.fl.phase)return true;
  return t===T_FLOOR||t===T_ODOOR||t===T_DOWN||t===T_UP||t===T_RUBBLE||t===T_ALTAR;
}
function monAt(x,y){return G.mons.find(m=>m.x===x&&m.y===y)}
function doPlayerMove(dx,dy){
  if(!G||G.over)return;
  const p=G.p,nx=p.x+dx,ny=p.y+dy;
  if(nx<0||ny<0||nx>=MW||ny>=MH)return;
  const m=monAt(nx,ny);
  if(m){
    if(m.ally){m.x=p.x;m.y=p.y;p.x=nx;p.y=ny;G.lastMove=true;endTurn();return}
    if(m.def.fl.shop&&!m.hostile){openShop(m);return}
    if(m.def.fl.heart&&!G.veinFight){veinDoor(m);return}
    playerAttack(m);G.lastMove=false;endTurn();return;
  }
  const t=G.map[ny][nx];
  if(p.status.ghost>0&&t!==undefined){
    if(nx>0&&ny>0&&nx<MW-1&&ny<MH-1){p.x=nx;p.y=ny;G.lastMove=true;endTurn()}
    return;
  }
  if(t===T_DOOR){G.map[ny][nx]=T_ODOOR;msg("You open the door.","mg-sys");G.lastMove=false;endTurn();return}
  if(t===T_WALL||t===T_VEIN){tryDig(nx,ny);return}
  if(t===T_FLOOR||t===T_ODOOR||t===T_DOWN||t===T_UP||t===T_RUBBLE||t===T_ALTAR){
    if(p.status.held>0){msg("You strain against the grip and hold your ground.","mg-dmg");endTurn();return}
    p.x=nx;p.y=ny;G.lastMove=true;
    for(let i=G.items.length-1;i>=0;i--){
      const gi=G.items[i];
      if(gi.x===nx&&gi.y===ny&&gi.it.t==="gold"){
        let gv=gi.it.v;
        if(behv("tithe")){const cut=Math.floor(gv*behv("tithe")/100);gv-=cut;if(cut)msg("The tithe takes "+cut+".","mg-dmg")}
        {const gg=godGold(gv);p.gold+=gg;msg("+"+gg+" gold.","mg-gold");}
        if(behv("goldXp"))tag("gambler",Math.max(1,Math.floor(gv/40)));
        if(p.gold>=2000)award("pockets");
        G.items.splice(i,1);
      }
    }
    const here=G.items.filter(i=>i.x===nx&&i.y===ny);
    if(here.length)msg("You see "+aName(here[0].it)+" here.","mg-sys");
    if(G.map[ny][nx]===T_ALTAR){openAltar(nx,ny);return}
    endTurn();
  }
}
function tryDig(x,y){
  const p=G.p;
  const hasPick=(p.eq.w&&WEAPONS[p.eq.w.k].pickax)||p.inv.some(i=>i.t==="wep"&&WEAPONS[i.k].pickax);
  if(!hasPick){msg("The rock does not negotiate with bare hands.","mg-sys");return}
  const key=x+","+y;const isVein=G.map[y][x]===T_VEIN;

  if(poolHasSkill("miner","Deep Foreman"))G.wallHp[key]=0;else G.wallHp[key]-=blow;
  p.ct.dig++;
  if(p.ct.dig===25)award("spelunk");
  tag("miner",Math.floor(3*stratumMult(G.depth)));
  if(G.wallHp[key]<=0){
    G.map[y][x]=T_RUBBLE;
    if(mergeActive("Delver")){
      let hitn=0;
      for(const m2 of G.mons.slice()){
        if(!m2.ally&&dist(x,y,m2.x,m2.y)<=1){const td=dice(2,6);damageMon(m2,td,"miner");hitn++}
      }
      if(hitn)msg("The tremor bites. "+hitn+" caught in the collapse.","mg-dmg");
    }
    if(isVein){
      G.veinsDug=(G.veinsDug||0)+1;
      if(G.veinsTotal>0&&G.veinsDug===G.veinsTotal){
        award("seam");dropCrate(2);
        announce("Clean seam. The mountain signs off on your work.","watch",true);
      }
      if(Math.random()<(mergeActive("Deep Surveyor")?.08:.03)){
        for(let yy=y-1;yy<=y+1;yy++)for(let xx=x-1;xx<=x+1;xx++)
          if(xx>0&&yy>0&&xx<MW-1&&yy<MH-1&&G.map[yy][xx]===T_WALL)G.map[yy][xx]=T_FLOOR;
        G.items.push({x,y,it:{t:"crate",tier:2}});
        announce("A hidden pocket. Someone walled this in on purpose.","watch",true);
      }else if(Math.random()<.3){
        const v=ri(30,90)*(1+stratumIdx(G.depth))*(mergeActive("Delver")?2:1);
        G.items.push({x,y,it:{t:"gold",v:Math.floor(v*(1+bonus("goldb")*0.25))}});
        msg("The vein spills a rough gem's worth of ore.","mg-gold");
      }else{
        const v=ri(20,60)*(1+stratumIdx(G.depth))*(mergeActive("Delver")?2:1);
        G.items.push({x,y,it:{t:"gold",v:Math.floor(v*(1+bonus("goldb")*0.25))}});
        msg("Ore glitters in the rubble.","mg-gold");
      }
    }else msg("The wall gives way.","mg-sys");
  }else msg("You swing the pick. Chips fly.","mg-sys");
  G.lastMove=false;
  endTurn();
}
function pickUp(){

  if(idx<0){msg("Nothing here.","mg-sys");return}

}
function weaponDamage(m){
  const p=G.p,it=p.eq.w;
  const w=it?WEAPONS[it.k]:{d:[1,2]};
  let dmg=dice(w.d[0],w.d[1])+smod(p.st[0])+(it?(it.b||0):0)+bonus("dmg");
  if(p.status.form>0)dmg+=3;
  if(p.status.wellfed>0&&poolHasSkill("cook","Monster Chef"))dmg+=2;
  if(it&&it.suf!==undefined){const sf=SUFFIX[it.suf];
    if(sf.brand){let bd=dice(sf.brand[0],sf.brand[1]);
      if(sf.el){const e2=monElScale(m,bd,sf.el);bd=e2.d;
        if(e2.t&&Math.random()<.3)msg("Your brand"+e2.t,"mg-hit")}
      dmg+=bd}
    if(sf.venom&&!m.def.fl.undead)dmg+=dice(1,6);
    if(sf.slay&&m.def.fl[sf.slay])dmg*=2;
    if(sf.stratb&&(it.si===undefined||it.si===stratumIdx(G.depth)))dmg+=2;
  }
  if(it&&it.x){
    if(it.x.brand)dmg+=dice(it.x.brand[0],it.x.brand[1]);
    if(it.x.slay&&m.def.fl[it.x.slay])dmg*=2;
    if(it.x.stratb)dmg+=2;
  }
  return Math.max(1,dmg);
}
function playerAttack(m){
  const p=G.p;
  if(m.def.fl.visit){msg("Your blow passes through tomorrow's problem.","mg-hit");return}
  if(m.phased){m.asleep=false;m.aware=true;
    msg("Your blow passes through where the "+m.def.n+" almost is.","mg-hit");return}
  const wasAsleep=m.asleep,sneak=(m.asleep||!m.aware);
  let ch=sneak?0.95:hitChance(meleeSkill(),m.def.ac);
  if(behv("annot")&&p.ct.inspected&&p.ct.inspected[m.def.n])ch=Math.min(0.95,ch+behv("annot")/100);
  m.asleep=false;m.aware=true;
  if(Math.random()>ch){msg("You miss the "+m.def.n+".","mg-hit");return}
  let dmg=weaponDamage(m);
  if(behv("freshBite")&&m.hp>=m.mhp)dmg+=behv("freshBite");
  if(behv("packBite")){const adj=G.mons.filter(o=>!o.ally&&o!==m&&dist(p.x,p.y,o.x,o.y)<=1).length;dmg+=behv("packBite")*adj}
  if(behv("execCut")&&m.hp<m.mhp/3)dmg=Math.floor(dmg*(1+behv("execCut")/100));
  if(behv("regicide")&&(m.def.fl.uq||m.def.fl.named||m.def.fl.boss))dmg=Math.floor(dmg*(1+behv("regicide")/100));
  if(behv("lastStand")&&p.hp<p.mhp/3)dmg=Math.floor(dmg*(1+behv("lastStand")/100));
  if(behv("fieldnotes"))dmg+=Math.min(5,Math.floor(Object.keys(p.killCt).length/10));
  let notes=[];
  if(sneak&&(p.org.backstab||bonus("backx")>0)){dmg*=((p.org.backstab?3:2)+bonus("backx"));notes.push("backstab")}
  if(mergeActive("Stalker")&&sneak){G._crit=true}
  if(Math.random()*100<bonus("critc")+bonus("luck")||G._crit){if(!notes.includes("crit")){dmg*=2;notes.push("crit")}G._crit=true;
    if(behv("critShield"))p.status.shield=Math.max(p.status.shield,behv("critShield"))}
  if(p.status.brand>0){dmg*=3;notes.push("branded")}
  G._slept=wasAsleep;
  const dead=damageMon(m,dmg,p.org.id);
  if(!dead)msg("You hit the "+m.def.n+" ("+dmg+(notes.length?", "+notes.join(", "):"")+"). "+Math.max(0,Math.ceil(m.hp))+"/"+m.mhp+" left.","mg-hit");
  const vp=behv("vamp");
  if(vp)p.hp=Math.min(p.mhp,p.hp+Math.max(1,Math.floor(dmg*vp/100)));
  if(!dead&&behv("procBurn")&&ri(1,100)<=behv("procBurn")){
    const ex=dice(2,6);msg("It smolders ("+ex+").","mg-dmg");damageMon(m,ex,p.org.id);
  }
  if(behv("procShock")&&ri(1,100)<=behv("procShock")){
    const o=G.mons.find(x=>x!==m&&!x.ally&&monSeen(x)&&dist(p.x,p.y,x.x,x.y)<=6);
    if(o){const ex=dice(1,6);msg("Lightning leaps to the "+o.def.n+" ("+ex+").","mg-mag");damageMon(o,ex,p.org.id)}
  }
  if(!dead&&behv("procPois")&&ri(1,100)<=behv("procPois")){m.pois=(m.pois||0)+ri(3,5);msg("Venom takes hold.","mg-dmg")}
  if(!dead&&behv("procNul")&&ri(1,100)<=behv("procNul")){m.nul=Math.max(m.nul||0,ri(4,8));msg("Its tricks go quiet.","mg-mag")}
  if(!dead&&behv("procSleep")&&ri(1,100)<=behv("procSleep")&&!m.def.fl.uq&&!m.def.fl.named&&!m.def.fl.boss){
    m.asleep=true;m.aware=false;msg("It nods off mid-fight.","mg-mag")}
  if(behv("cleave")){for(const o of G.mons.slice())if(!o.ally&&o!==m&&dist(p.x,p.y,o.x,o.y)<=1)damageMon(o,behv("cleave"),p.org.id)}
}
function damageMon(m,dmg,poolId){
  if(m.def.fl.heart&&!G.veinFight){msg("It does not notice. It is busy dreaming you.","mg-shard");return false}
  if(m.def.fl.uq==="veyn")dmg=Math.max(1,Math.ceil(dmg/2));
  const fc=G._crit?"df-crit":"df-hit";G._crit=false;
  dmgFloat(m.x,m.y,dmg,fc);
  if(m.def.fl.visit){if(monSeen(m)&&Math.random()<.25)msg("It is not entirely here. Not yet.","mg-mag");return false}
  if(m.phased){if(monSeen(m))msg("The blow finds nothing solid.","mg-mag");return false}
  m.hp-=dmg;
  if(m.def.fl.molt&&!m.molted&&m.hp>0&&m.hp<m.mhp*.4){
    m.molted=true;m.hp=Math.min(m.mhp,m.hp+Math.floor(m.mhp*.35));m.spdMul=1.4;
    m.def=Object.assign({},m.def,{dmg:[m.def.dmg[0]+1,m.def.dmg[1]],c:"#ff7ab0"});
    if(monSeen(m))announce("It sheds its shape for a worse one.","watch",true);
  }
  if(m.hp>0&&m.hp<m.mhp*.25&&!(m.afraid>0)&&!fearless(m)&&Math.random()<.4){
    m.afraid=ri(8,14);
    if(monSeen(m))msg("The "+m.def.n+" breaks.","mg-sys");
  }
  if(m.hp<=0){
    for(const o of G.mons)if(o!==m&&o.def.n===m.def.n&&!fearless(o)&&!(o.afraid>0)&&dist(o.x,o.y,m.x,m.y)<=7&&Math.random()<.5)o.afraid=ri(5,10);
    if(m.def.fl.uq==="seraph"&&!m.trans){
      m.trans=true;m.hp=Math.floor(m.mhp*0.6);
      m.def=Object.assign({},m.def,{dmg:[m.def.dmg[0]+1,m.def.dmg[1]],c:"#ff4a6a",sk:m.def.sk+2});
      announce("SERAPH-OF-MEAT unfolds into something worse.","watch",true);
      return false;
    }
    killMon(m,poolId);return true;
  }
  return false;
}
function killMon(m,poolId){
  const p=G.p,def=m.def;
  const i=G.mons.indexOf(m);if(i>=0)G.mons.splice(i,1);
  if(m.ally){msg("Your servant unravels.","mg-sys");return}
  if(def.gm==="split"&&!def.noSplit){
    for(let i=0;i<2;i++){
      const s=[[m.x+1,m.y],[m.x-1,m.y],[m.x,m.y+1],[m.x,m.y-1]].find(s=>passableFor(null,s[0],s[1])&&!monAt(s[0],s[1]));
      if(s){const half=Object.assign({},def,{n:"SHARD OF "+def.n,hpx:(def.hpx||1)*0.45,noSplit:1,fl:Object.assign({},def.fl,{named:0})});
        spawnMon(half,s[0],s[1]);}
    }
    msg(def.n+" comes apart into smaller arguments.","mg-dmg");
  }
  if(def.fl.named&&!G.p.codex.some(c=>c.n===def.n)){
    G.p.codex.push({g:def.g,c:def.c,n:def.n,xp:def.xp,d:def.d,fl:def.fl});
  }
  if(def.fl.undead&&!def.fl.audit){
    p.ct.undead=(p.ct.undead||0)+1;
    tag("bonecaller",Math.floor(5*stratumMult(G.depth)));
    const cap=1+bonus("thrall");
    const have=G.mons.filter(o=>o.ally&&o.thrall).length;
    if(poolHasSkill("bonecaller","COLD ROSTER")&&have<cap&&Math.random()<.35){
      const rd=Object.assign({},def,{n:"RISEN "+def.n,
        hpx:(def.hpx||1)*(mergeActive("Psychopomp")?1:0.5),
        fl:Object.assign({},def.fl,{named:0})});
      const rm=spawnMon(rd,m.x,m.y);
      rm.ally=true;rm.thrall=1;rm.aware=true;rm.asleep=false;
      msg("It stands back up on your side of things.","mg-shard");
      if(!G.stained1){G.stained1=1;stain(1,"The first one is the hardest to explain.")}
    }
  }
  const w=p.eq.w;

    announce("The weapon was "+SUFFIX[w.suf].n+".","watch")}
  let k=p.killCt[def.n]||0;

  }

  if(behv("xpb"))xp=Math.floor(xp*(1+behv("xpb")/100));

  G._slept=false;
  if(behv("killHaste"))p.status.haste=Math.max(p.status.haste,behv("killHaste"));
  if(behv("onkillHeal"))p.hp=Math.min(p.mhp,p.hp+behv("onkillHeal"));
  if(behv("onkillGold")){p.gold+=behv("onkillGold");if(p.gold>=2000)award("pockets")}
  if(behv("onkillSp"))p.sp=Math.min(p.msp,p.sp+behv("onkillSp"));
  if(behv("thirst"))p.sp=Math.max(0,p.sp-1);
  if(behv("loud")&&ri(1,100)<=behv("loud")){for(const o of G.mons){o.asleep=false;o.aware=true}
    msg("The kill rings out. Everything hears.","mg-dmg")}
  if(def.crew&&G.crew&&G.crew.alive.includes(def.n)){
    G.crew.alive=G.crew.alive.filter(n2=>n2!==def.n);

    else{G.crew.done=true;
      const ba=tryArtifact(Math.min(24,G.depth+3));
      if(ba)G.items.push({x:p.x,y:p.y,it:ba});
      const bg9=godGold(400);p.gold+=bg9;
      announce("The crew is finished. A bounty arrives, notarized. +"+bg9+" gold.","watch",true);}}
  if(p.god===2){p.godK=(p.godK||0)+1;if(p.godK>=5){p.godK-=5;p.piety=(p.piety||0)+1}}
  if(m.grudge){G.items.push({x:m.x,y:m.y,it:genRelic(Math.min(24,G.depth+3))});
    p.gold+=godGold(150);
    announce("The grudge settles. Its effects are yours, plus interest.","watch",true);}
  p.killCt[def.n]=k+1;
  p.batch.add(def.n);
  tag(poolId||p.org.id,xp);

  if(G.ktt>=3)award("overkill");
  msg("The "+def.n+" dies. +"+xp+" unbanked"+(k===0?" (first)":"")+".","mg-good");
  shardFeed(def);
  if(TONE>0&&Math.random()<TONE*0.02)msg(pick(QUIPS.kill),"mg-watch");
  if(m.loot)G.items.push({x:m.x,y:m.y,it:{t:"gold",v:m.loot}});
  if(def.fl.shop)stain(2,"Somewhere above, a franchise agreement catches fire.");
  if(def.fl.shop){
    for(const it of(m.stock||[]))G.items.push({x:m.x+ri(-1,1),y:m.y+ri(-1,1),it});
    G.items.push({x:m.x,y:m.y,it:{t:"gold",v:ri(200,500)}});
    announce("The till spills. The Company notices.","watch",true);
  }
  if(def.fl.uq&&!def.fl.boss){
    G.uniqDead[def.n]=true;award("slayer");
    announce(def.n+" is unmade. The dark files the paperwork.","watch",true);
  }
  if((def.fl.uq||def.fl.named)&&!def.fl.boss&&!def.fl.shop){
    G.items.push({x:m.x,y:m.y,it:genRelic(G.depth+2)});

  }
  if(Math.random()<.35)G.items.push({x:m.x,y:m.y,it:{t:"gold",v:ri(2,10)*G.depth}});
  else if(Math.random()<.3)G.items.push({x:m.x,y:m.y,it:{t:"part",of:def.n,g:def.g,uq:(def.fl.uq||def.fl.named)?1:0}});
  else if(!def.fl.audit&&Math.random()<.22+bonus("luck")/200){
    const r2=Math.random();
    const art=r2<.05?tryArtifact(G.depth):r2<.14?genRelic(G.depth):null;
    G.items.push({x:m.x,y:m.y,it:art||randItem(G.depth)});
  }
  if(def.fl.boss){
    G.balrogDead=true;
    G.map[m.y][m.x]=T_DOWN;
    winGame();
  }
  if(def.fl.heart&&G.veinFight)showEnding("strike");
}
function hurt(dmg,src){

  if(behv("riposte")&&ri(1,100)<=behv("riposte")&&dist(p.x,p.y,m.x,m.y)<=1){
    const rx=dice(1,6);msg("You answer in kind ("+rx+").","mg-hit");damageMon(m,rx,G.p.org.id);
  }
  if(fl.pois&&!p.race.ab.rPois&&bonus("rPois")<=0&&Math.random()<.5){p.status.pois+=ri(3,6);msg("You are poisoned.","mg-dmg")}
  if(fl.blind&&!p.race.ab.noBlind&&bonus("noBlind")<=0&&Math.random()<.4){p.status.blind=ri(3,6);msg("Your eyes fail.","mg-dmg")}
  if(fl.nulTouch&&resFor("rNull")<=0&&Math.random()<.5){p.status.nul=Math.max(p.status.nul||0,ri(4,7));p.sp=Math.max(0,p.sp-ri(2,5));
    if(p.shard)p.shard.cd=Math.max(p.shard.cd,4);
    msg("Your power is a word someone else is saying.","mg-dmg")}
  if(fl.conf&&resFor("rConf")<=0&&Math.random()<.4){p.status.migraine=Math.max(p.status.migraine,ri(3,6));
    msg("The noise gets into your aim.","mg-dmg")}
  if(STUNNERS.includes(m.def.n)&&resFor("freeAct")<=0&&Math.random()<.3){
    p.status.stun=Math.max(p.status.stun||0,ri(2,4));
    msg("The blow rings you like a bell.","mg-dmg")}
  if(GRABBERS.includes(m.def.n)&&resFor("freeAct")<=0&&!(p.status.held>0)&&Math.random()<.35){
    p.status.held=ri(2,4);
    msg("The "+m.def.n+" coils around you. You are held.","mg-dmg")}
  if(KNOCKERS.includes(m.def.n)&&resFor("freeAct")<=0&&!(p.status.prone>0)&&Math.random()<.25){
    p.status.prone=2;
    msg("The blow takes your legs. You are down.","mg-dmg")}
  if(fl.drainX){let any=false;
    const f=behv("unbGuard")?0.92:0.7;
    for(const k in p.unb){if(p.unb[k]>0)any=true;p.unb[k]=Math.floor(p.unb[k]*f)}
    if(!any){const pool=p.pools[orgPoolId()];if(pool)pool.xp=Math.max(0,pool.xp-20)}
    msg("You feel your promise dim.","mg-dmg")}
  if(fl.drainH){m.hp=Math.min(m.mhp,m.hp+Math.ceil(dmg/2))}
  if(fl.thief){
    if(p.gold>0){const take=Math.min(p.gold,ri(10,60));p.gold-=take;m.loot=(m.loot||0)+take;
      msg("The "+m.def.n+" lifts "+take+" gold and slips away.","mg-dmg")}
    else if(p.inv.length){const it=p.inv[ri(0,p.inv.length-1)];
      if(it!==p.eq.w&&it!==p.eq.a&&it!==p.eq.b&&it!==p.eq.s){
        p.inv.splice(p.inv.indexOf(it),1);
        msg("The "+m.def.n+" steals "+aName(it)+".","mg-dmg")}}
    const s=freeSpot(null);if(s){m.x=s.x;m.y=s.y}
  }
  if(fl.drainC&&Math.random()<.5){
    const dv=p.inv.find(i=>i.t==="dev"&&(i.ch||0)>0);
    if(dv){const take=Math.min(dv.ch,ri(1,2));dv.ch-=take;
      m.hp=Math.min(m.mhp,m.hp+4);m.hst=Math.max(m.hst||0,3);
      msg("The "+m.def.n+" drinks "+take+" charge"+(take>1?"s":"")+" from your "+DEVICES[dv.k].n+".","mg-dmg")}}
  if(fl.disen&&resFor("rDisen")<=0&&Math.random()<.4){
    const sl=["w","a","s","b"].filter(s2=>p.eq[s2]&&(p.eq[s2].b||0)>0);
    if(sl.length){const it2=p.eq[pick(sl)];it2.b--;
      msg("Corrosion takes a bite of "+itemName(it2)+".","mg-dmg")}}
  if(Math.random()<.2){
    for(const s3 of["a","s"]){const a3=p.eq[s3];
      if(a3&&a3.suf!==undefined&&!a3.sufKnown){a3.sufKnown=true;
        announce("The blow teaches you: it was "+SUFFIX[a3.suf].n+".","watch");break}}}
  hurt(dmg,m);
}
function allyAct(m){
  let best=null,bd=99;
  for(const e of G.mons)if(!e.ally&&dist(m.x,m.y,e.x,e.y)<bd){bd=dist(m.x,m.y,e.x,e.y);best=e}
  if(!best)return;
  if(bd<=1){
    if(Math.random()<.6){
      const dmg=dice(m.def.dmg[0],m.def.dmg[1]);
      const dead=damageMon(best,dmg,G.p.org.id);
      if(monSeen(m)||monSeen(best))msg("Your servant strikes the "+best.def.n+(dead?": slain.":" ("+dmg+")."),"mg-good");
    }
    return;
  }
  const dx=Math.sign(best.x-m.x),dy=Math.sign(best.y-m.y);
  for(const[ax,ay]of[[dx,dy],[dx,0],[0,dy]]){
    const nx=m.x+ax,ny=m.y+ay;
    if(!monAt(nx,ny)&&!(nx===G.p.x&&ny===G.p.y)&&passableFor(m,nx,ny)){m.x=nx;m.y=ny;return}
  }
}
function monHitAlly(m,a){
  if(Math.random()<.6){
    const dmg=dice(m.def.dmg[0],m.def.dmg[1]);
    const seen=monSeen(m)||monSeen(a);
    a.hp-=dmg;
    if(seen&&!a.ally&&Math.random()<.5)msg("The "+m.def.n+" savages the "+a.def.n+".","mg-sys");
    if(a.hp<=0){const i=G.mons.indexOf(a);if(i>=0)G.mons.splice(i,1);
      if(a.ally)msg("Your servant is torn apart.","mg-dmg");
      else if(seen)msg("The "+a.def.n+" is torn apart.","mg-sys")}
  }
}
/* ============ magic, powers, ranged ============ */
function nearestTarget(minD,maxD){
  const p=G.p;let best=null,bd=99;
  for(const m of G.mons){
    if(m.ally)continue;
    const d=dist(p.x,p.y,m.x,m.y);
    if(d<(minD||1)||d>(maxD||7))continue;
    if(!monSeen(m)||!losClear(p.x,p.y,m.x,m.y))continue;
    if(d<bd){bd=d;best=m}
  }
  return best;
}
function teleportPlayer(range){
  const p=G.p;const spots=[];
  for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++){
    if(G.map[y][x]!==T_FLOOR||monAt(x,y))continue;
    if(range&&dist(p.x,p.y,x,y)>range)continue;
    spots.push({x,y});
  }
  if(spots.length){const s=pick(spots);p.x=s.x;p.y=s.y;fov()}
}
function armTarget(k){
  const p=G.p;
  const foes=G.mons.filter(m=>!m.ally&&monSeen(m)&&losClear(p.x,p.y,m.x,m.y)&&dist(p.x,p.y,m.x,m.y)<=7);
  if(foes.length<=1){G._spellTarget=foes[0]||null;castSpell(k);return}
  G._targeting=k;G._spellTarget=null;
  msg("Tap a foe to aim "+SPELLS[k].n+". Tap yourself to cancel.","mg-mag");
  draw();
}
function castSpell(k){
  if(G.p.status.nul>0){msg("You reach for the words. Someone is holding them.","mg-dmg");return}
  const p=G.p,sd=SPELLS[k];
  const cost=Math.max(1,sd.sp-behv("spellThrift"));
  if(p.sp<cost){msg("Not enough SP.","mg-sys");return}
  let fail=clamp(.28-charLvl()*.012-smod(p.st[p.org.stat])*.04,.03,.6);
  if(suppressed()){fail=Math.min(.9,fail+.3);
    if(!G.supHint){G.supHint=1;msg("The working bends. Something nearby is unwriting it.","mg-mag")}}
  p.sp-=cost;
  if(Math.random()<fail){msg("The spell fizzles.","mg-mag");endTurn();return}
  tag(p.org.id,sd.sp);
  const lvl=charLvl();
  if(k==="breath"){
    const t=nearestTarget(1,5);
    if(!t){msg("No target in sight.","mg-sys");p.sp+=cost;return}
    t.asleep=false;t.aware=true;
    const dmg=dice(5,6,Math.floor(lvl/2));
    const dead=damageMon(t,dmg,p.org.id);
    msg("You breathe what was folded ("+dmg+")"+(dead?": ash.":"."),"mg-mag");
    endTurn();return;
  }
  if(k==="mirror"){spawnClone(14);endTurn();return}
  if(k==="mm"||k==="frost"||k==="orb"){
    const t=G._spellTarget&&G.mons.includes(G._spellTarget)&&monSeen(G._spellTarget)?G._spellTarget:nearestTarget(1,7);
    G._spellTarget=null;
    if(!t){msg("No target in sight.","mg-sys");p.sp+=cost;return}
    let dmg=k==="mm"?dice(1,4,Math.floor(lvl/2)):dice(3,6,Math.floor(lvl/2));
    if(k==="orb"&&t.def.fl.undead)dmg*=2;
    let btag="";
    if(k==="frost"){const e2=monElScale(t,dmg,"frost");dmg=e2.d;btag=e2.t}
    t.asleep=false;t.aware=true;
    const dead=dmg>0?damageMon(t,dmg,p.org.id):false;
    msg("The bolt strikes the "+t.def.n+" ("+dmg+btag+")"+(dead?": destroyed.":". "+Math.max(0,Math.ceil(t.hp))+"/"+t.mhp+" left."),"mg-mag");
  }else if(k==="fball"){
    const t=nearestTarget(1,7);
    if(!t){msg("No target in sight.","mg-sys");p.sp+=cost;return}
    msg("Fire blooms.","mg-mag");
    const cx=t.x,cy=t.y;
    for(const m of G.mons.slice()){
      if(m.ally||dist(cx,cy,m.x,m.y)>1)continue;
      m.asleep=false;m.aware=true;
      const e2=monElScale(m,dice(6,6),"fire");
      const dead=e2.d>0?damageMon(m,e2.d,p.org.id):false;
      msg("The "+m.def.n+" burns ("+e2.d+e2.t+")"+(dead?": ash.":"."),"mg-mag");
    }
  }else if(k==="phase")teleportPlayer(8);
  else if(k==="tele")teleportPlayer(0);
  else if(k==="det"){for(const m of G.mons)m.detected=true;msg("You sense what shares the level.","mg-mag")}
  else if(k==="haste"){p.status.haste=ri(15,25);msg("The world slows around you.","mg-mag")}
  else if(k==="bless"){p.status.bless=ri(12,20);msg("You feel righteous.","mg-mag")}
  else if(k==="shield"){p.status.shield=ri(12,20);msg("A ward settles over you.","mg-mag")}
  else if(k==="clw"){p.hp=Math.min(p.mhp,p.hp+dice(2,8));p.status.pois=Math.max(0,p.status.pois-4);msg("Wounds close.","mg-good")}
  else if(k==="csw"){p.hp=Math.min(p.mhp,p.hp+dice(4,8));p.status.pois=0;p.status.blind=0;msg("You are mended.","mg-good")}
  else if(k==="heal"){p.hp=Math.min(p.mhp,p.hp+dice(8,8));msg("You are made whole.","mg-good")}
  endTurn();
}
function fireBow(){
  const p=G.p,it=p.eq.b;
  if(!it){msg("Nothing to fire.","mg-sys");return}
  const b=BOWS[it.k];
  if(b.gun&&(!it.ammo||it.ammo<=0)){msg("Click. Empty.","mg-sys");return}
  const shots=1+bonus("bowshot");
  let fired=false;
  for(let s=0;s<shots;s++){
    if(b.gun&&it.ammo<=0)break;
    const t=nearestTarget(1,7);
    if(!t)break;
    fired=true;
    if(b.gun&&!(behv("ammoSave")&&ri(1,100)<=behv("ammoSave")))it.ammo--;
    t.asleep=false;t.aware=true;
    if(t.phased){msg("Your shot passes through where the "+t.def.n+" almost is.","mg-hit");continue}
    if(Math.random()<hitChance(bowSkill(),t.def.ac)){
      let dmg=Math.max(1,dice(b.d[0],b.d[1])+smod(p.st[3])+(it.b||0)+bonus("dmg"));
      if(it.x&&it.x.slay&&t.def.fl[it.x.slay])dmg*=2;
      if(Math.random()*100<bonus("critc")){dmg*=2;G._crit=true}
      const dead=damageMon(t,dmg,p.org.id);
      msg((b.gun?"The shot takes":"Your shot hits")+" the "+t.def.n+" ("+dmg+")"+(dead?": down.":"."),"mg-hit");
      if(!dead&&behv("reel")&&ri(1,100)<=behv("reel")){
        const adj=[[p.x+1,p.y],[p.x-1,p.y],[p.x,p.y+1],[p.x,p.y-1]].filter(s=>passableFor(null,s[0],s[1])&&!monAt(s[0],s[1]));
        if(adj.length){adj.sort((A,B)=>dist(A[0],A[1],t.x,t.y)-dist(B[0],B[1],t.x,t.y));
          t.x=adj[0][0];t.y=adj[0][1];msg("The line reels it to your feet.","mg-hit")}
      }
    }else msg("Your shot goes wide.","mg-hit");
  }
  if(!fired){msg("No target in range.","mg-sys");return}
  G.lastMove=false;
  endTurn();
}
function usePower(){
  const p=G.p,s=p.shard;
  if(!s){msg("No shard. Yet.","mg-shard");return}
  if(s.cd>0){msg(s.name+" needs "+s.cd+" more turns.","mg-shard");return}
  if(suppressed()){msg("Your shard goes quiet. Something nearby is holding its breath around it.","mg-shard");return}
  if(s.db.includes("movecond")&&!G.lastMove){msg("It only answers in motion.","mg-shard");return}
  if(s.db.includes("lowhp")&&p.hp>=p.mhp/2){msg("It only answers desperation.","mg-shard");return}
  const mag=s.mag+Math.floor((s.lvl-1)/2);
  let acted=true;
  if(s.eff==="blink")teleportPlayer(mag);
  else if(s.eff==="gravpull"){
    let n=0;
    for(const m of G.mons){
      if(m.ally||!monSeen(m)||!losClear(p.x,p.y,m.x,m.y))continue;
      for(let st2=0;st2<2;st2++){
        const dx=Math.sign(p.x-m.x),dy=Math.sign(p.y-m.y);
        const nx=m.x+dx,ny=m.y+dy;
        if(dist(nx,ny,p.x,p.y)<1)break;
        if(passableFor(m,nx,ny)&&!monAt(nx,ny)){m.x=nx;m.y=ny}
      }
      m.asleep=false;m.aware=true;
      damageMon(m,mag,p.org.id);n++;
    }
    msg(n?"Gravity remembers where you are. "+n+" dragged.":"Nothing to pull.","mg-shard");
  }
  else if(s.eff==="rage"){p.status.rage=8+mag;msg("Everything simplifies.","mg-shard")}
  else if(s.eff==="ghost"){p.status.ghost=mag;msg("You come apart, politely.","mg-shard")}
  else if(s.eff==="summon"){
    let n=0;
    for(let i=0;i<mag&&n<mag;i++){
      const sp=[[p.x+1,p.y],[p.x-1,p.y],[p.x,p.y+1],[p.x,p.y-1],[p.x+1,p.y+1],[p.x-1,p.y-1]].find(sp=>passableFor(null,sp[0],sp[1])&&!monAt(sp[0],sp[1]));
      if(!sp)break;
      spawnMon(pickMon(G.depth),sp[0],sp[1],true,26+s.lvl*3);n++;
    }
    msg(n?"You call, and "+n+" answer. They do not ask why.":"No room to call.","mg-shard");
  }
  else if(s.eff==="tinker"){
    if(p.inv.length>=INVMAX)msg("Your pack is full. The idea evaporates.","mg-sys");
    else{const d={t:"dev",k:pick(Object.keys(DEVICES)),ch:2+Math.ceil(s.rating/2)};
      p.inv.push(d);msg("You improvise: "+itemName(d)+".","mg-shard")}
  }
  else if(s.eff==="bolt"){
    const t=nearestTarget(s.db.includes("manton")?2:1,8);
    if(!t){msg("No target it will accept.","mg-shard");acted=false}
    else{const dmg=dice(2+Math.ceil(mag/2),6);
      t.asleep=false;t.aware=true;
      const dead=damageMon(t,dmg,p.org.id);
      msg(s.name+" answers ("+dmg+")"+(dead?": erased.":"."),"mg-shard")}
  }
  else if(s.eff==="mindmap"){
    for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)G.seen[y][x]=true;
    for(const m of G.mons)m.detected=true;
    msg("The level confesses its layout.","mg-shard");
  }
  else if(s.eff==="brand"){p.status.brand=6;msg("Your hands go quiet and certain.","mg-shard")}
  else if(s.eff==="form"){p.status.form=12+mag;msg("You borrow a worse shape.","mg-shard")}
  else if(s.eff==="nullify"){
    let n=0;
    for(const m of G.mons)if(!m.ally&&monSeen(m)){m.nul=mag;n++}
    msg(n?"Their tricks are suspended. "+n+" audited.":"No one to audit.","mg-shard");
  }
  else if(s.eff==="veil"){
    p.status.veil=mag;
    for(const m of G.mons)if(!m.def.fl.boss)m.aware=false;
    msg("The world forgets you, for now.","mg-shard");
  }
  if(!acted)return;
  s.cd=Math.max(1,s.cdMax-behv("cdb"));
  if(s.db.includes("aggro")){for(const m of G.mons){m.asleep=false;if(!p.status.veil)m.aware=true}
    msg("Everything below hears it.","mg-dmg")}
  if(s.db.includes("migraine"))p.status.migraine=3;
  if(s.db.includes("splock")&&p.msp>0){p.sp=0;msg("Your magic is collateral.","mg-dmg")}
  if(s.db.includes("feedback")){const fb=dice(1,4);p.hp-=fb;msg("Feedback ("+fb+").","mg-dmg");
    if(p.hp<=0){die("shard feedback");return}
    checkSecondTrigger();}
  G.lastMove=false;
  endTurn();
}
/* ============ consumables ============ */
function removeInv(it){const i=G.p.inv.indexOf(it);if(i>=0)G.p.inv.splice(i,1)}
function quaff(it){
  const p=G.p,k=it.k;
  if(it.t==="vial"){drinkVial(it);return}
  const wasUnknown=!G.idPot[k];
  G.idPot[k]=true;removeInv(it);
  if(wasUnknown){p.ct.quaffRow++;
    tag("alchemist",Math.floor(8*stratumMult(G.depth)));
    if(p.ct.quaffRow>=3)award("taste");
  }else p.ct.quaffRow=0;
  msg("You drink: "+POTIONS[k].n+".","mg-sys");
  const pB=n=>Math.floor(n*(1+behv("potb")/100));
  if(k==="clw"){p.hp=Math.min(p.mhp,p.hp+pB(dice(2,8)));p.status.pois=Math.max(0,p.status.pois-4)}
  else if(k==="csw"){p.hp=Math.min(p.mhp,p.hp+pB(dice(4,8)));p.status.pois=0;p.status.blind=0}
  else if(k==="heal")p.hp=Math.min(p.mhp,p.hp+pB(dice(8,8)));
  else if(k==="str"){if(p.st[0]<20){p.st[0]++;msg("You feel stronger.","mg-good")}}
  else if(k==="speed")p.status.haste=ri(15,25);
  if((k==="clw"||k==="csw"||k==="heal")&&mergeActive("Chirurgeon"))p.hp=Math.min(p.mhp,p.hp+dice(2,8));
  if(mergeActive("Transmuter Royal"))p.sp=Math.min(p.msp,p.sp+2);
  else if(k==="wit"){p.sp=p.msp;msg("Your thoughts line up and salute.","mg-good")}
  else if(k==="pois"){
    if(p.race.ab.rPois||bonus("rPois")>0||bonus("quaffsafe")>0)msg("It tastes rude but harmless.","mg-good");
    else{p.status.pois+=ri(8,14);msg("Poison. Of course.","mg-dmg")}
  }
  if(poolHasSkill("alchemist","Transmuter")&&Math.random()<.25&&p.inv.length<22){
    p.inv.push({t:"pot",k});msg("The empty bottle refills itself. Transmuter's due.","mg-good");
  }
  endTurn();
}
function drinkVial(it){
  const p=G.p;
  removeInv(it);
  if(!p.shard){
    const opts=[];
    for(let i=0;i<3;i++){
      const pw=genPower(it.r);
      opts.push({label:pw.name+" ("+pw.cls+" "+pw.rating+")",
        desc:pw.desc+(pw.db.length?". Cost: "+pw.db.map(d=>DRAWS[d].tx).join("; "):""),
        fn:()=>{p.shard=pw;p.triggered=true;award("vialed");
          announce("The vial takes. "+pw.name+". "+pw.cls+" "+pw.rating+".","shard",true);
          renderHud();endTurn()}});
    }
    announce("Three futures settle out of suspension. Choose.","shard",true);
    choiceModal("THE VIAL",opts);
    return;
  }
  if(Math.random()<.35){
    award("deviant");
    if(Math.random()<.5){
      const nd=Object.keys(DRAWS).filter(k=>!p.shard.db.includes(k));
      if(nd.length)p.shard.db.push(pick(nd));
      announce("Deviation. "+p.shard.name+" grows a new cost: "+DRAWS[p.shard.db[p.shard.db.length-1]].tx+".","shard",true);
    }else{
      const old=p.shard;
      p.shard=genPower(old.rating);
      p.shard.lvl=old.lvl;
      announce("Deviation. The shard sheds its shape: "+p.shard.name+" now. "+p.shard.cls+" "+p.shard.rating+".","shard",true);
    }
  }else{
    p.shard.lvl=Math.min(9,p.shard.lvl+1);p.shard.mag++;
    announce("The shard drinks. Level "+p.shard.lvl+".","shard",true);
  }
  renderHud();endTurn();
}
function readScroll(it){
  const p=G.p,k=it.k;
  const wasUnknown=!G.idScr[k];
  G.idScr[k]=true;
  if(k==="brand"){G.p.status.brand=Math.max(G.p.status.brand,12);

    msg("The air stiffens around you, politely.","mg-mag")}
  if(k==="recall"){
    if(G.recallT>0){G.recallT=0;msg("You cancel the requisition. The shaft sighs.","mg-sys")}
    else{G.recallT=15;msg("A requisition files itself. The manlift is coming for you.","mg-good")}}
  if(bonus("scrs")>0&&ri(1,100)<=bonus("scrs"))msg("The ink holds. The scroll survives.","mg-good");
  else removeInv(it);

function currentRoomTiles(){
  const p=G.p;
  const r=G.rooms.find(r=>p.x>=r.x&&p.x<r.x+r.w&&p.y>=r.y&&p.y<r.y+r.h);
  const s=new Set();
  if(r)for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++)s.add(x+","+y);
  else for(let y=p.y-1;y<=p.y+1;y++)for(let x=p.x-1;x<=p.x+1;x++)s.add(x+","+y);
  return s;
}

function eligibleMerges(){
  const p=G.p,ids=activePools().filter(id=>!p.pools[id].merged&&p.pools[id].lvl>=10&&POOLS[id]);
  const out=[];
  for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){
    const a=ids[i],b=ids[j];
    if(MERGES[[a,b].sort().join("+")]||POOLS[a].tags.some(t=>POOLS[b].tags.includes(t)))out.push([a,b]);
  }
  return out;
}
function mergeAct(){
  const pairs=eligibleMerges();
  if(!pairs.length){msg("No two classes are ready to merge. Both need level 10 and common ground.","mg-sys");return}
  const opts=pairs.map(([a,b])=>{
    const key=[a,b].sort().join("+");
    const M=MERGES[key]||{n:POOLS[a].n+"-"+POOLS[b].n,b:{mhp:4,hit:1},d:"An unlisted merger. The paperwork writes itself."};
    return{label:POOLS[a].n+" + "+POOLS[b].n+" = "+M.n,
      desc:M.d+" IRREVERSIBLE. Frees a class slot.",
      fn:()=>performMerge(a,b,M)};
  });
  opts.push({label:"Not yet",desc:"Keep them separate.",fn:()=>{closeModal()}});
  choiceModal("MERGE CLASSES",opts);
}
function performMerge(a,b,M){
  const p=G.p,pa=p.pools[a],pb=p.pools[b];
  const id="m_"+[a,b].sort().join("_");
  const merged={id,lvl:Math.max(pa.lvl,pb.lvl),xp:0,sk:pa.sk.concat(pb.sk),fork:M.n,merged:true};
  gainSk(merged,M.n+" (merge)",M.b);
  const tookOrigin=(a===p.org.id||b===p.org.id)||(p.orgPool&&(a===p.orgPool||b===p.orgPool));
  delete p.pools[a];delete p.pools[b];
  p.pools[id]=merged;
  if(tookOrigin)p.orgPool=id;
  award("merge");
  announce("Merge: "+M.n+", level "+merged.lvl+". There is no undo. A slot stands empty.","watch",true);
  if(tookOrigin)announce("Your origin pours into it. Every kill feeds "+M.n+" now.","watch",true);
  if(MERGELINE[M.n])announce(MERGELINE[M.n],"watch",true);
  closeModal();renderHud();
}

function processForks(){

  const f=G.forkQueue.shift();

function buildForkChoice(pool,tier){
  const opts=[];
  if(tier===10&&POOLS[pool.id]){
    for(const fk of POOLS[pool.id].forks){
      opts.push({label:"["+fk.n+"]",desc:fk.d,
        fn:()=>{pool.fork=fk.n;gainSk(pool,fk.n+" (fork)",fk.b);
          award("fork");
          announce(POOLS[pool.id].n+" forks: ["+fk.n+"].","watch",true);
          closeModal();renderHud();processForks()}});
    }
  }else{
    const trio=[{n:"Deep Focus",b:{dmg:2}},{n:"Warded",b:{ac:2,save:1}},{n:"Enduring",b:{mhp:8}}];
    for(const fk of trio){
      opts.push({label:"["+fk.n+"]",desc:"Advancement at "+tier+".",
        fn:()=>{gainSk(pool,fk.n+" ("+tier+")",fk.b);
          announce((pool.fork||POOLS[pool.id].n)+" advances: ["+fk.n+"].","watch",true);
          closeModal();renderHud();processForks()}});
    }
  }
  opts.push({label:"Stay the course",desc:"+1 to hit, +1 AC. No drama.",
    fn:()=>{gainSk(pool,"Tempered",{hit:1,ac:1});closeModal();renderHud();processForks()}});
  choiceModal("THE "+(pool.fork||POOLS[pool.id].n).toUpperCase()+" DIVERGES",opts);
}

const ZMIN=0.55,ZMAX=3;
let ZOOM=1;
try{const z=parseFloat(localStorage.getItem("uh2zoom"));if(z>=ZMIN&&z<=ZMAX)ZOOM=z}catch(e){}
function setZoom(z){
  ZOOM=clamp(z,ZMIN,ZMAX);
  try{localStorage.setItem("uh2zoom",ZOOM.toFixed(3))}catch(e){}
  if(G)draw();
}
let PANX=0,PANY=0,PLAST=null;
function viewGeom(W,H){
  if(W===undefined){const st=el("stage");W=st.clientWidth;H=st.clientHeight}
  const base=Math.min(W/29,H/19);
  const ts=Math.max(6,Math.floor(base*ZOOM));
  const p=G.p;
  if(!isFinite(PANX)||!isFinite(PANY)){PANX=0;PANY=0}
  if(!PLAST||PLAST.x!==p.x||PLAST.y!==p.y){PLAST={x:p.x,y:p.y};PANX=0;PANY=0}
  const fitW=W/ts,fitH=H/ts;
  let ox,oy,px,py,VW,VH;
  if(fitW>=MW){PANX=0;VW=MW;ox=0;px=Math.floor((W-MW*ts)/2)}
  else{
    const cx=clamp(p.x+0.5+PANX-fitW/2,0,MW-fitW);
    PANX=cx+fitW/2-p.x-0.5;
    ox=Math.floor(cx);px=-Math.round((cx-ox)*ts);
    VW=Math.min(MW-ox,Math.ceil(fitW)+1);
  }
  if(fitH>=MH){PANY=0;VH=MH;oy=0;py=Math.floor((H-MH*ts)/2)}
  else{
    const cy=clamp(p.y+0.5+PANY-fitH/2,0,MH-fitH);
    PANY=cy+fitH/2-p.y-0.5;
    oy=Math.floor(cy);py=-Math.round((cy-oy)*ts);
    VH=Math.min(MH-oy,Math.ceil(fitH)+1);
  }
  return{W,H,ts,VW,VH,ox,oy,px,py};
}
function panBy(dx,dy){
  const st=el("stage"),W=st.clientWidth,H=st.clientHeight;
  const base=Math.min(W/29,H/19);
  const ts=Math.max(6,Math.floor(base*ZOOM));
  PANX+=dx/ts;PANY+=dy/ts;
  if(!PRAF)PRAF=requestAnimationFrame(()=>{PRAF=0;if(G)draw()});
}

let TILES_READY=false;
let TILE_ON=true;
try{TILE_ON=localStorage.getItem("uh2tiles")!=="0"}catch(e){}
const TILEIMG=(typeof Image!=="undefined")?new Image():null;
if(TILEIMG){
  TILEIMG.onload=()=>{TILES_READY=true;try{if(G)renderAll()}catch(e){}};
  TILEIMG.onerror=()=>{TILES_READY=false};
  TILEIMG.src=TILEPNG;
}
function tOn(){return TILE_ON&&TILES_READY&&TILEIMG}
let _sprCSS=false;
function sprHTML(key,px,cls){
  const i=TILEIX[key];
  if(i===undefined)return"";
  if(!_sprCSS){_sprCSS=true;
    try{const st=document.createElement("style");
      st.textContent=".bigspr{background-image:url("+TILEPNG+")}";
      document.head.appendChild(st);}catch(e){}}
  const c=i%TILECOLS,r=Math.floor(i/TILECOLS);
  return '<div class="bigspr '+(cls||"")+'" style="width:'+px+'px;height:'+px+'px;background-size:'+(TILECOLS*px)+'px auto;background-position:'+(-c*px)+'px '+(-r*px)+'px"></div>';
}
function pcSprKey(){
  const p=G&&G.p;if(!p)return"pc_human";
  if(p.evolved&&TILEIX["pc_"+p.evolved]!==undefined)return"pc_"+p.evolved;
  return TILEIX["pc_"+p.race.id]!==undefined?"pc_"+p.race.id:"pc_human";
}
function portraitURL(px,gear){
  try{
    const cv=document.createElement("canvas");cv.width=px;cv.height=px;
    const c=cv.getContext("2d");c.imageSmoothingEnabled=false;
    const draw=k=>{const i=TILEIX[k];if(i===undefined)return;
      c.drawImage(TILEIMG,(i%TILECOLS)*32,Math.floor(i/TILECOLS)*32,32,32,0,0,px,px)};
    if(gear.evolved&&TILEIX["pc_"+gear.evolved]!==undefined){draw("pc_"+gear.evolved);return cv.toDataURL()}
    draw(TILEIX["pc_"+gear.race]!==undefined?"pc_"+gear.race:"pc_human");
    draw("ly_legs");draw("ly_boots");
    if(gear.a&&TILEIX["ly_a_"+gear.a]!==undefined)draw("ly_a_"+gear.a);
    if(TILEIX["ly_hair_"+gear.race]!==undefined)draw("ly_hair_"+gear.race);
    if(TILEIX["ly_beard_"+gear.race]!==undefined)draw("ly_beard_"+gear.race);
    if(gear.c)draw("it_crown");
    if(gear.s&&TILEIX["ly_s_"+gear.s]!==undefined)draw("ly_s_"+gear.s);
    if(gear.w&&TILEIX["ly_w_"+gear.w]!==undefined)draw("ly_w_"+gear.w);
    else if(gear.b&&TILEIX["ly_b_"+gear.b]!==undefined)draw("ly_b_"+gear.b);
    return cv.toDataURL();
  }catch(e){return null}
}
function gearOf(p){
  return{race:p.race.id,evolved:p.evolved,
    w:p.eq.w?p.eq.w.k:null,b:p.eq.b?p.eq.b.k:null,
    a:p.eq.a?p.eq.a.k:null,s:p.eq.s?p.eq.s.k:null,c:!!p.eq.c};
}
function portraitHTML(px,gear){
  const u=(tOn())?portraitURL(px,gear):null;
  if(u)return '<img class="pcSpr" alt="" style="width:'+px+'px;height:'+px+'px;image-rendering:pixelated;display:block;margin:0 auto" src="'+u+'">';
  const k=(gear.evolved&&TILEIX["pc_"+gear.evolved]!==undefined)?"pc_"+gear.evolved:
          (TILEIX["pc_"+gear.race]!==undefined?"pc_"+gear.race:"pc_human");
  return sprHTML(k,px,"pcSpr");
}
function slotOf(it){
  for(const s of["w","b","a","s","r1","r2","c"])if(G.p.eq[s]===it)return s;
  return null;

function blit(key,dx,dy,ts,alpha){
  const i=TILEIX[key];
  if(i===undefined)return false;
  const sx=(i%TILECOLS)*32,sy=Math.floor(i/TILECOLS)*32;
  const oa=CTX.globalAlpha;
  if(alpha!==undefined)CTX.globalAlpha=alpha;
  CTX.imageSmoothingEnabled=false;

  CTX.globalAlpha=oa;
  return true;
}

function terrKey(t,mx,my){

function draw(){
  if(!G||!CTX)return;
  const st=el("stage"),W=st.clientWidth,H=st.clientHeight;
  CTX.fillStyle="#000";CTX.fillRect(0,0,W,H);
  const {ts,VW,VH,ox,oy,px,py}=viewGeom(W,H);
  const p=G.p;
  CTX.font=(ts-2)+"px ui-monospace,Menlo,monospace";
  CTX.textAlign="center";CTX.textBaseline="middle";
  for(let y=0;y<VH;y++)for(let x=0;x<VW;x++){
    const mx=ox+x,my=oy+y;
    if(mx>=MW||my>=MH)continue;
    if(!G.seen[my][mx])continue;
    const vis=G.vis[my][mx];
    const t=G.map[my][mx];
    const cx=px+x*ts+ts/2,cy=py+y*ts+ts/2;
    if(tOn()){
      const a=vis?1:.38;
      blit("floor"+stratumIdx(G.depth),px+x*ts,py+y*ts,ts,a);
      const tk=terrKey(t,mx,my);
      if(tk&&tk!=="floor"+stratumIdx(G.depth))blit(tk,px+x*ts,py+y*ts,ts,a);
      if(G.threshold&&G.threshold.tiles.has(mx+","+my)&&t!==T_WALL){
        CTX.fillStyle="rgba(216,178,90,0.14)";
        CTX.fillRect(px+x*ts,py+y*ts,ts,ts);
      }
    }else{
      if(G.threshold&&G.threshold.tiles.has(mx+","+my)&&t!==T_WALL){
        CTX.fillStyle="rgba(216,178,90,0.10)";
        CTX.fillRect(px+x*ts,py+y*ts,ts,ts);
      }
      let g=GLYPH[t],col;
      if(t===T_WALL)col=PAL.wall;
      else if(t===T_VEIN)col=PAL.acc;
      else if(t===T_DOWN||t===T_UP)col=PAL.acc;
      else if(t===T_DOOR||t===T_ODOOR)col="#a08858";
      else col=PAL.floor;
      CTX.globalAlpha=vis?1:.42;
      CTX.fillStyle=col;
      CTX.fillText(g,cx,cy);
    }
  }
  CTX.globalAlpha=1;
  for(const i of G.items){
    if(i.x<ox||i.y<oy||i.x>=ox+VW||i.y>=oy+VH)continue;
    if(!G.vis[i.y][i.x])continue;
    const dX=px+(i.x-ox)*ts,dY=py+(i.y-oy)*ts;
    const ik=tOn()?itemKey(i.it):null;
    if(ik&&blit(ik,dX,dY,ts)){
